name: Publish MMS image

# Builds the Unbroker fork (outbound MMS support) as a Docker image and pushes
# it to GHCR. The image is self-contained: build/package/Dockerfile compiles the
# Go binary and the entrypoint runs `db:migrate up` before starting the server,
# so the new MMS enum migration applies automatically on deploy.
#
# Railway's deploy (unbroker-llc/sms-gateway-server) sets its Dockerfile to
# `FROM ghcr.io/unbroker-llc/server:<tag>`. Pin an immutable `sha-<short>` tag
# for reproducible deploys, or `mms` for the latest build on the branch.

on:
  push:
    branches:
      - mms/outbound-support
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set RELEASE_ID
        run: echo "RELEASE_ID=$(( ($(date +%s) - $(date -d '2022-06-15' +%s)) / 86400 ))" >> "${GITHUB_ENV}"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=mms
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=sms-gateway-server (Unbroker MMS fork)
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/package/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP=sms-gateway
            APP_VERSION=mms-${{ github.sha }}
            APP_RELEASE_ID=${{ env.RELEASE_ID }}
